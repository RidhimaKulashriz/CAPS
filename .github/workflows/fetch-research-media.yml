name: Fetch research media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-research-videos.mjs"

permissions:
  contents: write

jobs:
  fetch-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch real PMC MP4 assets
        run: node scripts/fetch-research-videos.mjs

      - name: Commit bundled media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/research/videos
          if git diff --cached --quiet; then
            echo "No media changes."
            exit 0
          fi
          git commit -m "Bundle verified cancer research MP4 assets"
          git push origin HEAD:main
